name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor Android project
        run: |
          mkdir -p www
          cp index.html styles.css db.js app.js manifest.json sw.js icon.png icon-192.png www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.cangjian.app",
            "appName": "藏笺",
            "webDir": "www",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Apply Custom Launcher Icon
        run: |
          python3 -m pip install -q pillow
          python3 - << 'PYEOF'
          from PIL import Image, ImageDraw
          import os

          src = Image.open('icon.png').convert('RGBA')
          res_dir = 'android/app/src/main/res'

          sizes = {
              'mipmap-mdpi': (48, 108),
              'mipmap-hdpi': (72, 162),
              'mipmap-xhdpi': (96, 216),
              'mipmap-xxhdpi': (144, 324),
              'mipmap-xxxhdpi': (192, 432),
          }

          for folder, (icon_sz, fg_sz) in sizes.items():
              out_dir = os.path.join(res_dir, folder)
              os.makedirs(out_dir, exist_ok=True)

              # Square launcher icon
              sq = src.resize((icon_sz, icon_sz), Image.Resampling.LANCZOS)
              sq.save(os.path.join(out_dir, 'ic_launcher.png'))

              # Round launcher icon
              mask = Image.new('L', (icon_sz, icon_sz), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, icon_sz, icon_sz), fill=255)
              rd = Image.new('RGBA', (icon_sz, icon_sz), (0, 0, 0, 0))
              rd.paste(sq, (0, 0), mask)
              rd.save(os.path.join(out_dir, 'ic_launcher_round.png'))

              # Adaptive icon foreground (centered at 76% inside safe zone)
              bg_color = src.getpixel((5, 5))
              fg = Image.new('RGBA', (fg_sz, fg_sz), bg_color)
              inner_sz = int(round(fg_sz * 0.76))
              inner = src.resize((inner_sz, inner_sz), Image.Resampling.LANCZOS)
              pad = (fg_sz - inner_sz) // 2
              fg.paste(inner, (pad, pad), inner)
              fg.save(os.path.join(out_dir, 'ic_launcher_foreground.png'))

          # Match adaptive icon background color to pale sky-blue
          bg_xml = os.path.join(res_dir, 'values', 'ic_launcher_background.xml')
          with open(bg_xml, 'w', encoding='utf-8') as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#F4F9FC</color>\n</resources>\n')
          PYEOF

      - name: Add Camera permission to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />|' "$MANIFEST"
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cangjian-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cangjian-android-apk
          path: cangjian-android.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" cangjian-android.apk --clobber
            gh release edit "$TAG" --title "藏笺 Android APK 安装包" --notes "自动构建的 Android 安装包（包名 com.cangjian.app），下载 cangjian-android.apk 后可直接在安卓手机安装使用（含完整本地存储、位置拍照、自定义采购清单及数据导出迁移功能）。"
          else
            gh release create "$TAG" cangjian-android.apk \
              --title "藏笺 Android APK 安装包" \
              --notes "自动构建的 Android 安装包（包名 com.cangjian.app），下载 cangjian-android.apk 后可直接在安卓手机安装使用（含完整本地存储、位置拍照、自定义采购清单及数据导出迁移功能）。"
          fi
